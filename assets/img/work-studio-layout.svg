<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 1000' role='img' aria-labelledby='title desc'>
  <title id='title'>Editorial landing project placeholder</title>
  <desc id='desc'>A realistic editorial landing page with strong typography, rhythm, and conversion touchpoints.</desc>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#f5f4f0'/>
      <stop offset='1' stop-color='#eceae3'/>
    </linearGradient>
    <linearGradient id='hero' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#dbe4e7'/>
      <stop offset='1' stop-color='#c6d4da'/>
    </linearGradient>
    <linearGradient id='panel' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#f7f7f4'/>
      <stop offset='1' stop-color='#efede6'/>
    </linearGradient>
    <filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='20' stdDeviation='22' flood-color='#101319' flood-opacity='0.16'/>
    </filter>
    <pattern id='grain' width='120' height='120' patternUnits='userSpaceOnUse'>
      <rect width='120' height='120' fill='transparent'/>
      <circle cx='10' cy='16' r='0.6' fill='#111318' opacity='0.08'/>
      <circle cx='82' cy='34' r='0.6' fill='#111318' opacity='0.08'/>
